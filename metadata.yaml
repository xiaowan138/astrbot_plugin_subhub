name: astrbot_plugin_subhub # 插件唯一识别名
display_name: 统一订阅推送中心 # 用于展示的名字
desc: |
  一站式订阅推送插件。聚合 12 类内容源 + 任意 RSS/Atom：
  热搜榜（微博/百度/知乎/抖音/腾讯新闻/B站/36氪）、
  信息列表（Steam特惠/今日更新番剧/GitHub Trending/HackerNews/V2EX）。
  按设定时间或间隔自动主动推送到群聊/会话，也可手动触发，
  Pillow 渲染成美观图片卡片（明暗两套主题）。
  特色功能：关键词过滤订阅、每日汇总卡片、订阅级独立调度、
  静默时段（夜间不打扰）、连续失败自动暂停（自愈）、订阅导入导出。
  多级开关：全局总开关 + 群级暂停 + 单订阅开关；一键测试全部来源。
  用法示例：
  - /订阅 微博热搜 [关键词:原神]    订阅内置源（可带关键词过滤）
  - /订阅 rss <链接>                 订阅任意 RSS/Atom
  - /查看 <源>|编号                  立即抓取推送一次
  - /我的订阅 /退订 <编号>           管理订阅
  - /订阅间隔 HH:MM|分钟|off         本会话调度（HH:MM 每日定时；分钟数轮询）
  - /订阅间隔 <编号> HH:MM|分钟      某个订阅独立调度
  - /订阅汇总 HH:MM|off              每天一张汇总卡片（多来源合并）
  - /推送总开关 on|off               全局自动推送总开关（需管理员）
  - /订阅测试                        一键验证全部来源
short_desc: 统一订阅推送中心：12 类源（热搜/Steam/番剧/GitHub/HN/V2EX）+ RSS 定时推送，支持关键词过滤与每日汇总。
version: v1.1.0 # 插件版本号。格式：v1.1.1 或 v1.1
author: xiaowan138 # 作者
repo: https://github.com/xiaowan138/astrbot_plugin_subhub.git # 插件仓库地址
astrbot_version: ">=4.5.7" # 需要 send_message / 图片组件等 API
tags:
  - 订阅
  - RSS
  - 热搜
  - 推送
  - 定时
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - discord
  - lark
